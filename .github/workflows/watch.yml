name: watch

# Opens a pull request for each new release of Tarantool and tt upstream,
# each new series of Tarantool, and each package served whose libraries
# Arch Linux moved on from: see scripts/watch.sh. Nothing is published
# until a maintainer merges it.

on:
  schedule:
    - cron: "41 5 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: watch
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  watch:
    name: Watch
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      # Push the branches of the pull requests, open them, and start the
      # check workflow on them.
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # With WATCH_TOKEN, a token of a user or a GitHub App, the pull
      # requests start the check workflow themselves; those opened with
      # the GITHUB_TOKEN start none, and the check workflow is started on
      # their branches.
      - name: Open pull requests for new builds
        env:
          GH_TOKEN: ${{ secrets.WATCH_TOKEN || github.token }}
          GH_REPO: ${{ github.repository }}
          WATCH_DISPATCH: ${{ secrets.WATCH_TOKEN == '' }}
        run: scripts/watch.sh
