name: publish

# Builds each package of packages/ whose version has no published release
# yet, installs and tests it on a clean Arch Linux, and publishes it as a
# release of its own; then makes the pacman repository anew of the
# releases and deploys it to GitHub Pages. The builds run with no secrets
# and no write access: the jobs after them publish what they made.

on:
  push:
    branches: [master]
    paths:
      - packages/**
      - keys/**
      - scripts/**
      - .github/workflows/publish.yml
  workflow_dispatch:

permissions: {}

# One run at a time, so that the site of a run is not deployed over that of
# a later one. A run queued behind another plans anew when it starts.
concurrency:
  group: publish
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      publish: ${{ steps.plan.outputs.publish }}
      builds: ${{ steps.plan.outputs.builds }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: plan
        name: Plan
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          HAS_SIGNING_KEY: ${{ secrets.SIGNING_KEY != '' }}
        run: |
          # The repository signs: fail before the builds, not after them.
          if compgen -G 'keys/*.asc' > /dev/null && [ "$HAS_SIGNING_KEY" != true ]; then
            echo "::error::keys/ has keys, but the secret SIGNING_KEY is not set"
            exit 1
          fi
          plan=$RUNNER_TEMP/plan.json
          scripts/plan.sh > "$plan"
          {
            echo "publish=$(jq -c .publish "$plan")"
            echo "builds=$(jq -c .builds "$plan")"
          } >> "$GITHUB_OUTPUT"
          jq -r '.publish[] | "- `\(.tag)`: \(.release)"' "$plan" >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Build ${{ matrix.pkgbase }} ${{ matrix.version }} ${{ matrix.arch }}
    needs: plan
    if: needs.plan.outputs.builds != '[]'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.builds) }}
    env:
      PKGBASE: ${{ matrix.pkgbase }}
      PACKAGER: publish workflow <https://github.com/${{ github.repository }}>
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build
        run: scripts/docker.sh --root scripts/makepkg.sh "packages/$PKGBASE" out

      - name: Install and test
        run: scripts/docker.sh --root scripts/install-test.sh "$PKGBASE" out/*.pkg.tar.zst

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pkg-${{ matrix.pkgbase }}-${{ matrix.arch }}
          path: out/*.pkg.tar.zst
          if-no-files-found: error
          retention-days: 7

  # Each build whose every arch built: a package that failed to build is
  # left out, and the site keeps serving its previous release.
  publish:
    name: Publish
    needs: [plan, build]
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.publish != '[]' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      # Create the releases.
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: pkg-*
          path: out
          merge-multiple: true

      - name: Publish the releases
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PUBLISH: ${{ needs.plan.outputs.publish }}
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        run: |
          failed=0
          while read -r pkgbase; do
            echo "::group::$pkgbase"
            scripts/publish.sh "$pkgbase" out || failed=1
            echo "::endgroup::"
          done < <(jq -r '.[].pkgbase' <<<"$PUBLISH")
          exit "$failed"

  site:
    name: Site
    needs: [plan, publish]
    if: ${{ !cancelled() && needs.plan.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Make the site
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        run: |
          scripts/docker.sh --root scripts/site.sh site
          jq -r '.packages[] | "- `\(.file)` of `\(.release)`"' site/index.json >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  # Whatever was skipped or failed before the site: a skipped ancestor
  # would skip it too otherwise, and leave the site as it was.
  deploy:
    name: Deploy
    needs: site
    if: ${{ !cancelled() && needs.site.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
